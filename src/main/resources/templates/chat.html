<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — Почаївська громада</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdf9f3; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .chat-layout { flex: 1; display: flex; overflow: hidden; }
        .conversations-panel {
            width: 300px; min-width: 220px; border-right: 1px solid #dee2e6;
            overflow-y: auto; background: #fff;
        }
        .conversation-item {
            padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }
        .conversation-item:hover, .conversation-item.active { background: #fff3e8; }
        .conv-name { font-weight: 600; font-size: 0.9rem; }
        .conv-last { font-size: 0.78rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge-unread { background: #f4731c; }
        .messages-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages-area {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .bubble {
            max-width: 65%; padding: 8px 14px; border-radius: 18px;
            font-size: 0.88rem; line-height: 1.4; word-break: break-word;
        }
        .bubble-sent { background: #f4731c; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bubble-recv { background: #e9ecef; color: #212529; align-self: flex-start; border-bottom-left-radius: 4px; }
        .bubble-meta { font-size: 0.7rem; opacity: 0.65; margin-top: 2px; }
        .input-bar { padding: 12px 16px; border-top: 1px solid #dee2e6; background: #fff; }
        .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 1rem; }
        .btn-orange { background-color: #f4731c; color: white; border: none; }
        .btn-orange:hover { background-color: #d9621a; color: white; }
        .ws-status { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; }
        .ws-connected { background: #d4edda; color: #155724; }
        .ws-disconnected { background: #f8d7da; color: #721c24; }
        .presence-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 6px; vertical-align: middle;
        }
        .presence-online { background: #28a745; }
        .presence-offline { background: #ccc; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-light px-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">Почаївська громада</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Послуги</a></li>
                <li class="nav-item"><a class="nav-link" href="/businesses/list">Бізнес</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Товари</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Акції</a></li>
            </ul>
            <span id="wsStatus" class="ws-status ws-disconnected ms-3">● офлайн</span>
        </div>
    </div>
</nav>

<!-- Chat layout -->
<div class="chat-layout">
    <!-- Conversations list -->
    <div class="conversations-panel" id="conversationsPanel">
        <div class="p-3 border-bottom fw-semibold text-muted" style="font-size:0.85rem;">РОЗМОВИ</div>
        <div id="convList">
            <div class="p-3 text-muted" style="font-size:0.85rem;">Завантаження...</div>
        </div>
    </div>

    <!-- Messages area -->
    <div class="messages-panel" id="messagesPanel">
        <div class="empty-state" id="emptyState">Оберіть розмову, щоб почати</div>
        <div class="messages-area d-none" id="messagesArea"></div>
        <div class="input-bar d-none" id="inputBar">
            <div class="d-flex gap-2">
                <input type="text" id="msgInput" class="form-control" placeholder="Введіть повідомлення..." autocomplete="off">
                <button class="btn btn-orange px-4" id="sendBtn">Надіслати</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
    let currentUser = null;
    let activeConversation = null;
    let stompClient = null;
    let conversations = [];
    let onlineUsers = new Set();

    // ── Bootstrap ──────────────────────────────────────────────
    async function init() {
        try {
            const res = await fetch('/api/auth/me');
            if (!res.ok) { window.location.href = '/login'; return; }
            currentUser = await res.json();
        } catch (e) {
            window.location.href = '/login';
            return;
        }
        await loadConversations();
        await loadPresence();
        connectWS();
    }

    // ── Conversations ──────────────────────────────────────────
    async function loadConversations() {
        const res = await fetch('/api/chat/conversations?userId=' + currentUser.id);
        if (!res.ok) return;
        conversations = await res.json();
        renderConversations();
    }

    async function loadPresence() {
        try {
            const res = await fetch('/api/chat/presence');
            if (res.ok) {
                const users = await res.json();
                onlineUsers = new Set(users);
            }
        } catch (e) { /* ignore */ }
    }

    function renderConversations() {
        const list = document.getElementById('convList');
        if (conversations.length === 0) {
            list.innerHTML = '<div class="p-3 text-muted" style="font-size:0.85rem;">Немає розмов</div>';
            return;
        }
        list.innerHTML = conversations.map(c => {
            const otherId = c.participantOneId === currentUser.id ? c.participantTwoId : c.participantOneId;
            const otherName = c.participantOneId === currentUser.id ? c.participantTwoName : c.participantOneName;
            const isOnline = onlineUsers.has(String(otherId));
            const dot = `<span class="presence-dot ${isOnline ? 'presence-online' : 'presence-offline'}"></span>`;
            const unread = c.unreadCount > 0 ? `<span class="badge badge-unread rounded-pill ms-1">${c.unreadCount}</span>` : '';
            const last = c.lastMessage ? escHtml(c.lastMessage) : '<em>Немає повідомлень</em>';
            const active = activeConversation && activeConversation.id === c.id ? ' active' : '';
            return `<div class="conversation-item${active}" data-id="${c.id}" onclick="openConversation(${c.id})">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="conv-name">${dot}${escHtml(otherName)}</span>${unread}
                </div>
                <div class="conv-last">${last}</div>
            </div>`;
        }).join('');
    }

    // ── Open conversation ──────────────────────────────────────
    async function openConversation(convId) {
        activeConversation = conversations.find(c => c.id === convId);
        renderConversations();

        document.getElementById('emptyState').classList.add('d-none');
        document.getElementById('messagesArea').classList.remove('d-none');
        document.getElementById('inputBar').classList.remove('d-none');

        const res = await fetch('/api/chat/conversations/' + convId + '/messages');
        if (!res.ok) return;
        const messages = await res.json();
        renderMessages(messages);

        // Mark as read
        fetch('/api/chat/conversations/' + convId + '/read?userId=' + currentUser.id, { method: 'POST' });

        // Update unread count locally
        const conv = conversations.find(c => c.id === convId);
        if (conv) conv.unreadCount = 0;
        renderConversations();

        document.getElementById('msgInput').focus();
    }

    function renderMessages(messages) {
        const area = document.getElementById('messagesArea');
        area.innerHTML = messages.map(m => buildBubble(m)).join('');
        area.scrollTop = area.scrollHeight;
    }

    function buildBubble(m) {
        const sent = m.senderId === currentUser.id;
        const cls = sent ? 'bubble-sent' : 'bubble-recv';
        const time = m.sentAt ? new Date(m.sentAt).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) : '';
        return `<div class="bubble ${cls}">
            ${escHtml(m.content)}
            <div class="bubble-meta">${time}</div>
        </div>`;
    }

    // ── Send message ───────────────────────────────────────────
    function sendMessage() {
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content || !activeConversation || !stompClient) return;

        const recipientId = activeConversation.participantOneId === currentUser.id
            ? activeConversation.participantTwoId
            : activeConversation.participantOneId;

        stompClient.publish({
            destination: '/app/chat.private',
            body: JSON.stringify({
                conversationId: activeConversation.id,
                recipientId: recipientId,
                content: content
            })
        });
        input.value = '';
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('msgInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ── WebSocket ──────────────────────────────────────────────
    function connectWS() {
        stompClient = new StompJs.Client({
            webSocketFactory: () => new SockJS('/ws'),
            reconnectDelay: 5000,
            onConnect: () => {
                setWsStatus(true);
                stompClient.subscribe('/user/queue/messages', onMessage);
                stompClient.subscribe('/topic/presence', onPresence);
            },
            onDisconnect: () => setWsStatus(false),
            onStompError: () => setWsStatus(false)
        });
        stompClient.activate();
    }

    function onMessage(frame) {
        const msg = JSON.parse(frame.body);

        // Update conversations list
        const conv = conversations.find(c => c.id === msg.conversationId);
        if (conv) {
            conv.lastMessage = msg.content;
            conv.lastMessageAt = msg.sentAt;
            if (!activeConversation || activeConversation.id !== conv.id) {
                conv.unreadCount = (conv.unreadCount || 0) + 1;
            }
        }
        renderConversations();

        // Append bubble if this conversation is open
        if (activeConversation && activeConversation.id === msg.conversationId) {
            const area = document.getElementById('messagesArea');
            area.insertAdjacentHTML('beforeend', buildBubble(msg));
            area.scrollTop = area.scrollHeight;

            // Mark as read immediately
            fetch('/api/chat/conversations/' + msg.conversationId + '/read?userId=' + currentUser.id, { method: 'POST' });
        }
    }

    function onPresence(frame) {
        const event = JSON.parse(frame.body);
        if (event.online) {
            onlineUsers.add(String(event.userId));
        } else {
            onlineUsers.delete(String(event.userId));
        }
        renderConversations();
    }

    function setWsStatus(connected) {
        const el = document.getElementById('wsStatus');
        if (connected) {
            el.textContent = '● онлайн';
            el.className = 'ws-status ws-connected ms-3';
        } else {
            el.textContent = '● офлайн';
            el.className = 'ws-status ws-disconnected ms-3';
        }
    }

    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
</script>
</body>
</html>
