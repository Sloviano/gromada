spring.application.name=gromada

# ─── Datasource (PostgreSQL) ───
spring.datasource.url=jdbc:postgresql://localhost:5432/gromada
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ─── Jackson (JSON serialization) ───
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Redis (set gromada.redis.enabled=true when Redis is available) ───
gromada.redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ─── AI Agent API Key ───
gromada.ai.api-key=${AI_API_KEY:changeme-dev-key}

# ─── SQL Init ───
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=
spring.jpa.defer-datasource-initialization=true
