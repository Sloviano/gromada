spring.application.name=gromada

# ─── PostgreSQL Datasource ───
spring.datasource.url=jdbc:postgresql://localhost:5432/gromada
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:gromada}
spring.datasource.password=${DB_PASSWORD:gromada}

# ─── JPA / Hibernate ───
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ─── Jackson (JSON serialization) ───
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── AI Agent API Key ───
gromada.ai.api-key=${AI_API_KEY:changeme-dev-key}
