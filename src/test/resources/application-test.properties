# Test profile: uses a separate PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/gromada_test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:gromada}
spring.datasource.password=${DB_PASSWORD:gromada}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.sql.init.mode=never
